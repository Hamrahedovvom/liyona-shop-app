name: Build Liyona Android v1.8

on:
  workflow_dispatch:
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: "3.24.5"
          channel: stable
          cache: true

      - name: Show Flutter version
        run: flutter --version

      - name: Check source
        run: |
          if [ ! -f "liyona-flutter-source-v1.8.zip" ]; then
            echo "ERROR: liyona-flutter-source-v1.8.zip not found"
            echo "Repository files:"
            ls -lah
            exit 1
          fi

          echo "Source ZIP found successfully."
          ls -lh liyona-flutter-source-v1.8.zip

      - name: Extract source
        run: |
          rm -rf build_source
          mkdir build_source

          unzip -q liyona-flutter-source-v1.8.zip -d build_source

          echo "Source extracted."

      - name: Find Flutter project
        id: project
        run: |
          PUBSPEC=$(find build_source -type f -name "pubspec.yaml" | head -n 1)

          if [ -z "$PUBSPEC" ]; then
            echo "ERROR: pubspec.yaml not found"
            find build_source -maxdepth 3 -type f
            exit 1
          fi

          PROJECT_DIR=$(dirname "$PUBSPEC")

          echo "Flutter project found:"
          echo "$PROJECT_DIR"

          echo "dir=$PROJECT_DIR" >> "$GITHUB_OUTPUT"

      - name: Check project
        working-directory: ${{ steps.project.outputs.dir }}
        run: |
          echo "Project directory:"
          pwd

          echo "Project files:"
          ls -lah

          if [ ! -f "pubspec.yaml" ]; then
            echo "ERROR: Invalid Flutter project"
            exit 1
          fi

      - name: Get dependencies
        working-directory: ${{ steps.project.outputs.dir }}
        run: flutter pub get

      - name: Analyze source
        working-directory: ${{ steps.project.outputs.dir }}
        run: flutter analyze --no-fatal-infos --no-fatal-warnings

      - name: Build APK
        working-directory: ${{ steps.project.outputs.dir }}
        run: flutter build apk --release

      - name: Prepare APK
        run: |
          APK="${{ steps.project.outputs.dir }}/build/app/outputs/flutter-apk/app-release.apk"

          if [ ! -f "$APK" ]; then
            echo "ERROR: APK not generated"
            exit 1
          fi

          mkdir -p release
          cp "$APK" "release/Liyona-v1.8.apk"

          echo "APK generated successfully:"
          ls -lh release/Liyona-v1.8.apk

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: Liyona-v1.8-APK
          path: release/Liyona-v1.8.apk
          if-no-files-found: error
          retention-days: 30
