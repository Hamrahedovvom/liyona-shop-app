name: Build Liyona Android APK

on:
  workflow_dispatch:
  push:
    branches:
      - main

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.24.5'
          channel: stable
          cache: true

      - name: Unzip Liyona source
        run: |
          rm -rf liyona-source buildapp
          unzip -o liyona-flutter-source.zip -d liyona-source
          SOURCE_DIR=$(dirname "$(find liyona-source -name pubspec.yaml | head -n 1)")
          echo "SOURCE_DIR=$SOURCE_DIR" >> "$GITHUB_ENV"
          echo "Source project: $SOURCE_DIR"

      - name: Create fresh Flutter Android project
        run: |
          flutter create \
            --platforms=android \
            --org com.liyona \
            --project-name shop \
            buildapp

      - name: Copy Liyona app files
        run: |
          rm -rf buildapp/lib buildapp/assets
          cp -R "$SOURCE_DIR/lib" buildapp/lib
          cp -R "$SOURCE_DIR/assets" buildapp/assets
          cp "$SOURCE_DIR/pubspec.yaml" buildapp/pubspec.yaml

      - name: Fix Liyona source code
        run: |
          python3 - <<'PY'
          from pathlib import Path

          p = Path("buildapp/lib/screens/home_screen.dart")
          s = p.read_text(encoding="utf-8")

          s = s.replace(
              "  )));\\n}",
              "  ));\\n}"
          )

          p.write_text(s, encoding="utf-8")

          print("home_screen.dart fixed successfully")
          PY

      - name: Set Android app name
        run: |
          python3 - <<'PY'
          from pathlib import Path

          p = Path(
              "buildapp/android/app/src/main/AndroidManifest.xml"
          )

          s = p.read_text(encoding="utf-8")

          s = s.replace(
              'android:label="shop"',
              'android:label="Liyona"'
          )

          p.write_text(s, encoding="utf-8")
          PY

      - name: Install dependencies
        working-directory: buildapp
        run: |
          flutter pub get

      - name: Generate launcher icon
        working-directory: buildapp
        run: |
          dart run flutter_launcher_icons

      - name: Generate splash screen
        working-directory: buildapp
        run: |
          dart run flutter_native_splash:create

      - name: Analyze Flutter project
        working-directory: buildapp
        run: |
          flutter analyze --no-fatal-infos --no-fatal-warnings

      - name: Build release APK
        working-directory: buildapp
        run: |
          flutter build apk --release

      - name: Prepare APK
        run: |
          cp \
            buildapp/build/app/outputs/flutter-apk/app-release.apk \
            Liyona-Shop.apk

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: Liyona-Shop-APK
          path: Liyona-Shop.apk
          if-no-files-found: error
