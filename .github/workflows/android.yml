name: Build Liyona Android APK

on:
  workflow_dispatch:
  push:
    branches:
      - main

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.24.5'
          channel: stable
          cache: true

      - name: Check source
        run: |
          ls -lah
          test -f liyona-flutter-source-v1.7.zip

      - name: Extract source
        run: |
          rm -rf liyona-source
          rm -rf buildapp
          mkdir -p liyona-source
          unzip -o liyona-flutter-source-v1.7.zip -d liyona-source
          PUBSPEC=$(find liyona-source -name pubspec.yaml -type f | head -n 1)
          test -n "$PUBSPEC"
          SOURCE_DIR=$(dirname "$PUBSPEC")
          echo "SOURCE_DIR=$SOURCE_DIR" >> "$GITHUB_ENV"
          echo "Source directory: $SOURCE_DIR"

      - name: Create Flutter Android project
        run: |
          flutter create \
            --platforms=android \
            --org com.liyona \
            --project-name shop \
            buildapp

      - name: Copy source
        run: |
          rm -rf buildapp/lib
          rm -rf buildapp/assets
          rm -rf buildapp/test

          cp -R "$SOURCE_DIR/lib" buildapp/lib
          cp "$SOURCE_DIR/pubspec.yaml" buildapp/pubspec.yaml

          if [ -d "$SOURCE_DIR/assets" ]; then
            cp -R "$SOURCE_DIR/assets" buildapp/assets
          fi

      - name: Add Android permissions
        run: |
          MANIFEST="buildapp/android/app/src/main/AndroidManifest.xml"

          sed -i '2i\
          <uses-permission android:name="android.permission.INTERNET" />\
          <uses-permission android:name="android.permission.ACCESS_NETWORK_STATE" />' "$MANIFEST"

          sed -i 's/android:label="shop"/android:label="Liyona"/g' "$MANIFEST"

          cat "$MANIFEST"

      - name: Install dependencies
        working-directory: buildapp
        run: flutter pub get

      - name: Analyze source
        working-directory: buildapp
        run: flutter analyze --no-fatal-infos --no-fatal-warnings

      - name: Generate app icon
        working-directory: buildapp
        run: |
          if grep -q "flutter_launcher_icons" pubspec.yaml; then
            dart run flutter_launcher_icons
          else
            echo "Skipping launcher icons"
          fi

      - name: Generate splash
        working-directory: buildapp
        run: |
          if grep -q "flutter_native_splash" pubspec.yaml; then
            dart run flutter_native_splash:create
          else
            echo "Skipping splash generation"
          fi

      - name: Build APK
        working-directory: buildapp
        run: flutter build apk --release

      - name: Prepare APK
        run: |
          test -f buildapp/build/app/outputs/flutter-apk/app-release.apk
          cp buildapp/build/app/outputs/flutter-apk/app-release.apk Liyona-Shop-v1.7.apk
          ls -lh Liyona-Shop-v1.7.apk

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: Liyona-Shop-v1.7-APK
          path: Liyona-Shop-v1.7.apk
          if-no-files-found: error
