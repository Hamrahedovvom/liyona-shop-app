name: Build Liyona Android APK

on:
  workflow_dispatch:
  push:
    branches:
      - main

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.24.5'
          channel: stable
          cache: true

      - name: Check source file
        run: |
          ls -la

          if [ ! -f "liyona-flutter-source-v1.3.zip" ]; then
            echo "ERROR: liyona-flutter-source-v1.3.zip not found"
            exit 1
          fi

      - name: Extract Liyona source
        run: |
          rm -rf liyona-source buildapp

          unzip -o \
            liyona-flutter-source-v1.3.zip \
            -d liyona-source

          SOURCE_DIR=$(dirname "$(find liyona-source -name pubspec.yaml | head -n 1)")

          echo "SOURCE_DIR=$SOURCE_DIR" >> "$GITHUB_ENV"

      - name: Create Android project
        run: |
          flutter create \
            --platforms=android \
            --org com.liyona \
            --project-name shop \
            buildapp

      - name: Copy Liyona files
        run: |
          rm -rf buildapp/lib
          rm -rf buildapp/assets
          rm -rf buildapp/test

          cp -R "$SOURCE_DIR/lib" buildapp/lib
          cp -R "$SOURCE_DIR/assets" buildapp/assets
          cp "$SOURCE_DIR/pubspec.yaml" buildapp/pubspec.yaml

      - name: Fix source
        run: |
          python3 - <<'PY'
          from pathlib import Path

          p = Path("buildapp/lib/screens/home_screen.dart")

          if p.exists():
              lines = p.read_text(encoding="utf-8").splitlines()
              fixed = []

              for line in lines:
                  if line.strip() == ")));":
                      fixed.append(line.replace(")));", "));"))
                  else:
                      fixed.append(line)

              p.write_text(
                  "\n".join(fixed) + "\n",
                  encoding="utf-8"
              )
          PY

      - name: Configure Android
        run: |
          python3 - <<'PY'
          from pathlib import Path

          manifest = Path(
              "buildapp/android/app/src/main/AndroidManifest.xml"
          )

          text = manifest.read_text(encoding="utf-8")

          if "android.permission.INTERNET" not in text:
              pos = text.find(">")

              permissions = (
                  '\n    <uses-permission android:name="android.permission.INTERNET"/>'
                  '\n    <uses-permission android:name="android.permission.ACCESS_NETWORK_STATE"/>'
              )

              text = (
                  text[:pos + 1]
                  + permissions
                  + text[pos + 1:]
              )

          text = text.replace(
              'android:label="shop"',
              'android:label="Liyona"'
          )

          manifest.write_text(
              text,
              encoding="utf-8"
          )
          PY

      - name: Install dependencies
        working-directory: buildapp
        run: |
          flutter pub get

      - name: Generate app icon
        working-directory: buildapp
        run: |
          dart run flutter_launcher_icons

      - name: Generate splash screen
        working-directory: buildapp
        run: |
          dart run flutter_native_splash:create

      - name: Build APK
        working-directory: buildapp
        run: |
          flutter build apk --release

      - name: Rename APK
        run: |
          cp \
            buildapp/build/app/outputs/flutter-apk/app-release.apk \
            Liyona-Shop-v1.3.apk

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: Liyona-Shop-v1.3-APK
          path: Liyona-Shop-v1.3.apk
          if-no-files-found: error
