name: Build Liyona Android v1.9.2 Fixed

on:
  workflow_dispatch:
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  build:
    name: Build Liyona APK
    runs-on: ubuntu-24.04
    timeout-minutes: 40

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Java 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"

      - name: Setup Flutter 3.24.5
        uses: subosito/flutter-action@v2
        with:
          flutter-version: "3.24.5"
          channel: stable
          cache: true

      - name: Show Flutter version
        run: flutter --version

      - name: Check fixed source ZIP
        shell: bash
        run: |
          set -e

          SOURCE="liyona-flutter-source-v1.9.2-fixed.zip"

          if [ ! -f "$SOURCE" ]; then
            echo "ERROR: $SOURCE not found."
            echo "Repository files:"
            ls -lah
            exit 1
          fi

          echo "Fixed source ZIP found successfully:"
          ls -lh "$SOURCE"

      - name: Extract fixed source
        shell: bash
        run: |
          set -e

          rm -rf build_source
          mkdir -p build_source

          unzip -q liyona-flutter-source-v1.9.2-fixed.zip -d build_source

          echo "Source extracted successfully."

      - name: Find Flutter project
        id: project
        shell: bash
        run: |
          set -e

          PUBSPEC=$(find build_source -type f -name "pubspec.yaml" | head -n 1)

          if [ -z "$PUBSPEC" ]; then
            echo "ERROR: pubspec.yaml not found."
            echo "Extracted files:"
            find build_source -maxdepth 4 -type f
            exit 1
          fi

          PROJECT_DIR=$(dirname "$PUBSPEC")

          echo "Flutter project found:"
          echo "$PROJECT_DIR"

          echo "dir=$PROJECT_DIR" >> "$GITHUB_OUTPUT"

      - name: Check build script
        working-directory: ${{ steps.project.outputs.dir }}
        shell: bash
        run: |
          set -e

          if [ ! -f "build_android.sh" ]; then
            echo "ERROR: build_android.sh not found."
            ls -lah
            exit 1
          fi

          chmod +x build_android.sh

          echo "build_android.sh found successfully."

      - name: Build Liyona v1.9.2 Fixed
        working-directory: ${{ steps.project.outputs.dir }}
        shell: bash
        run: |
          set -e

          echo "Starting Liyona v1.9.2 fixed build..."
          bash build_android.sh

      - name: Verify release APK
        working-directory: ${{ steps.project.outputs.dir }}
        shell: bash
        run: |
          set -e

          APK="build/app/outputs/flutter-apk/app-release.apk"

          if [ ! -f "$APK" ]; then
            echo "ERROR: app-release.apk was not generated."
            echo "Available build files:"
            find build -type f 2>/dev/null || true
            exit 1
          fi

          echo "APK generated successfully:"
          ls -lh "$APK"

      - name: Prepare final APK
        shell: bash
        run: |
          set -e

          mkdir -p release

          cp \
            "${{ steps.project.outputs.dir }}/build/app/outputs/flutter-apk/app-release.apk" \
            "release/Liyona-v1.9.2-fixed.apk"

          echo "Final APK:"
          ls -lh release/Liyona-v1.9.2-fixed.apk

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: Liyona-v1.9.2-Fixed-APK
          path: release/Liyona-v1.9.2-fixed.apk
          if-no-files-found: error
          retention-days: 30
