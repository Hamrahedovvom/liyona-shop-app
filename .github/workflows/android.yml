name: Build Liyona Android v1.8

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    name: Build Android APK
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: "3.24.5"
          channel: stable
          cache: true

      - name: Flutter version
        run: flutter --version

      - name: Check source file
        shell: bash
        run: |
          set -e

          SOURCE="liyona-flutter-source-v1.8.zip"

          if [ ! -f "$SOURCE" ]; then
            echo "ERROR: $SOURCE not found in repository root."
            echo ""
            echo "Files in repository:"
            ls -lah
            exit 1
          fi

          echo "Source found:"
          ls -lh "$SOURCE"

      - name: Extract source
        shell: bash
        run: |
          set -e

          rm -rf liyona_app
          mkdir -p liyona_app

          unzip -q liyona-flutter-source-v1.8.zip -d liyona_app

          echo "Extracted files:"
          ls -lah liyona_app

      - name: Detect Flutter project
        id: project
        shell: bash
        run: |
          set -e

          PUBSPEC=$(find liyona_app -name pubspec.yaml -type f | head -n 1)

          if [ -z "$PUBSPEC" ]; then
            echo "ERROR: pubspec.yaml not found."
            find liyona_app -maxdepth 3 -type f | head -100
            exit 1
          fi

          PROJECT_DIR=$(dirname "$PUBSPEC")

          echo "Flutter project: $PROJECT_DIR"
          echo "dir=$PROJECT_DIR" >> "$GITHUB_OUTPUT"

      - name: Ensure Android platform exists
        shell: bash
        working-directory: ${{ steps.project.outputs.dir }}
        run: |
          set -e

          if [ ! -d "android" ]; then
            echo "Android folder not found. Creating platform files..."
            flutter create --platforms=android .
          fi

      - name: Ensure Android Internet permissions
        shell: bash
        working-directory: ${{ steps.project.outputs.dir }}
        run: |
          set -e

          MANIFEST="android/app/src/main/AndroidManifest.xml"

          if [ ! -f "$MANIFEST" ]; then
            echo "ERROR: AndroidManifest.xml not found."
            exit 1
          fi

          if ! grep -q "android.permission.INTERNET" "$MANIFEST"; then
            sed -i '/<manifest/a\
    <uses-permission android:name="android.permission.INTERNET"/>' "$MANIFEST"
          fi

          if ! grep -q "android.permission.ACCESS_NETWORK_STATE" "$MANIFEST"; then
            sed -i '/<manifest/a\
    <uses-permission android:name="android.permission.ACCESS_NETWORK_STATE"/>' "$MANIFEST"
          fi

          echo "Android permissions:"
          grep "uses-permission" "$MANIFEST" || true

      - name: Flutter clean
        working-directory: ${{ steps.project.outputs.dir }}
        run: flutter clean

      - name: Get dependencies
        working-directory: ${{ steps.project.outputs.dir }}
        run: flutter pub get

      - name: Analyze source
        working-directory: ${{ steps.project.outputs.dir }}
        shell: bash
        run: |
          flutter analyze --no-fatal-infos --no-fatal-warnings

      - name: Build release APK
        working-directory: ${{ steps.project.outputs.dir }}
        run: flutter build apk --release

      - name: Check APK
        shell: bash
        run: |
          set -e

          APK="${{ steps.project.outputs.dir }}/build/app/outputs/flutter-apk/app-release.apk"

          if [ ! -f "$APK" ]; then
            echo "ERROR: APK was not generated."
            exit 1
          fi

          mkdir -p release
          cp "$APK" release/Liyona-v1.8.apk

          echo "APK successfully generated:"
          ls -lh release/Liyona-v1.8.apk

      - name: Upload Liyona APK
        uses: actions/upload-artifact@v4
        with:
          name: Liyona-v1.8-APK
          path: release/Liyona-v1.8.apk
          if-no-files-found: error
          retention-days: 30
