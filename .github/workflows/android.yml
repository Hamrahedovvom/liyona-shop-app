name: Build Liyona Android APK

on:
  workflow_dispatch:
  push:
    branches:
      - main

jobs:
  build:
    runs-on: ubuntu-24.04

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Java
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.24.5'
          channel: stable
          cache: true

      - name: Check source ZIP
        shell: bash
        run: |
          echo "Checking repository files..."
          ls -lah

          if [ ! -f "liyona-flutter-source-v1.7.zip" ]; then
            echo "ERROR: liyona-flutter-source-v1.7.zip not found"
            exit 1
          fi

          echo "Source ZIP found."

      - name: Extract source
        shell: bash
        run: |
          rm -rf liyona-source
          rm -rf buildapp

          mkdir -p liyona-source

          unzip -o \
            liyona-flutter-source-v1.7.zip \
            -d liyona-source

          PUBSPEC=$(find liyona-source -name pubspec.yaml | head -n 1)

          if [ -z "$PUBSPEC" ]; then
            echo "ERROR: pubspec.yaml not found inside ZIP"
            exit 1
          fi

          SOURCE_DIR=$(dirname "$PUBSPEC")

          echo "SOURCE_DIR=$SOURCE_DIR" >> "$GITHUB_ENV"
          echo "Flutter source: $SOURCE_DIR"

      - name: Create clean Flutter project
        shell: bash
        run: |
          flutter create \
            --platforms=android \
            --org com.liyona \
            --project-name shop \
            buildapp

      - name: Copy Liyona source
        shell: bash
        run: |
          rm -rf buildapp/lib
          rm -rf buildapp/assets
          rm -rf buildapp/test

          cp -R "$SOURCE_DIR/lib" buildapp/lib

          if [ -d "$SOURCE_DIR/assets" ]; then
            cp -R "$SOURCE_DIR/assets" buildapp/assets
          fi

          cp "$SOURCE_DIR/pubspec.yaml" \
             buildapp/pubspec.yaml

          echo "Files copied successfully."

      - name: Configure Android
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path

          manifest = Path(
              "buildapp/android/app/src/main/AndroidManifest.xml"
          )

          text = manifest.read_text(encoding="utf-8")

          if "android.permission.INTERNET" not in text:
              pos = text.find(">")

              permissions = """
    <uses-permission android:name="android.permission.INTERNET"/>
    <uses-permission android:name="android.permission.ACCESS_NETWORK_STATE"/>
              """

              text = (
                  text[:pos + 1]
                  + permissions
                  + text[pos + 1:]
              )

          text = text.replace(
              'android:label="shop"',
              'android:label="Liyona"'
          )

          manifest.write_text(
              text,
              encoding="utf-8"
          )

          print("AndroidManifest configured.")
          PY

      - name: Flutter version
        shell: bash
        run: |
          flutter --version
          dart --version

      - name: Install dependencies
        working-directory: buildapp
        run: flutter pub get

      - name: Format Dart source
        working-directory: buildapp
        shell: bash
        run: |
          dart format lib

      - name: Flutter analyze
        working-directory: buildapp
        shell: bash
        run: |
          flutter analyze \
            --no-fatal-infos \
            --no-fatal-warnings

      - name: Generate app icon
        working-directory: buildapp
        shell: bash
        run: |
          if grep -q "flutter_launcher_icons" pubspec.yaml; then
            dart run flutter_launcher_icons
          else
            echo "flutter_launcher_icons not configured - skipping"
          fi

      - name: Generate splash screen
        working-directory: buildapp
        shell: bash
        run: |
          if grep -q "flutter_native_splash" pubspec.yaml; then
            dart run flutter_native_splash:create
          else
            echo "flutter_native_splash not configured - skipping"
          fi

      - name: Clean before build
        working-directory: buildapp
        shell: bash
        run: |
          flutter clean
          flutter pub get

      - name: Build release APK
        working-directory: buildapp
        shell: bash
        run: |
          flutter build apk \
            --release

      - name: Verify APK
        shell: bash
        run: |
          APK="buildapp/build/app/outputs/flutter-apk/app-release.apk"

          if [ ! -f "$APK" ]; then
            echo "ERROR: APK was not generated"
            exit 1
          fi

          echo "APK generated successfully:"
          ls -lh "$APK"

      - name: Prepare APK
        shell: bash
        run: |
          cp \
            buildapp/build/app/outputs/flutter-apk/app-release.apk \
            Liyona-Shop-v1.7.apk

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: Liyona-Shop-v1.7-APK
          path: Liyona-Shop-v1.7.apk
          if-no-files-found: error
          retention-days: 30
