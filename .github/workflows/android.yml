name: Build Liyona Android APK

on:
  workflow_dispatch:
  push:
    branches:
      - main

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.24.5'
          channel: 'stable'
          cache: true

      - name: Unzip Liyona source
        run: |
          unzip -o liyona-flutter-source.zip -d liyona-source
          ls -la liyona-source

      - name: Find Flutter project
        run: |
          find liyona-source -name pubspec.yaml -print

      - name: Install dependencies
        run: |
          PROJECT_DIR=$(dirname "$(find liyona-source -name pubspec.yaml | head -n 1)")
          cd "$PROJECT_DIR"
          flutter pub get

      - name: Build APK
        run: |
          PROJECT_DIR=$(dirname "$(find liyona-source -name pubspec.yaml | head -n 1)")
          cd "$PROJECT_DIR"
          flutter build apk --release

      - name: Prepare APK
        run: |
          PROJECT_DIR=$(dirname "$(find liyona-source -name pubspec.yaml | head -n 1)")
          cp "$PROJECT_DIR/build/app/outputs/flutter-apk/app-release.apk" Liyona-Shop.apk

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: Liyona-Shop-APK
          path: Liyona-Shop.apk
